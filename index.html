            // ---------- 数据规范化 ----------
            function normalizeBookItem(item) {
                if (!item || typeof item !== 'object') return null;

                const title = typeof item.title === 'string' ? item.title.trim() : '';
                if (!title) return null;

                const rawDictation = Array.isArray(item.dictation)
                    ? item.dictation
                    : (typeof item.dictation === 'string'
                        ? item.dictation.split(/[、，,;；]+/)
                        : []);

                return {
                    title,
                    url: typeof item.url === 'string' ? item.url.trim() : '',
                    category: typeof item.category === 'string'
                        ? item.category.trim()
                        : (typeof item.type === 'string' ? item.type.trim() : ''),
                    dictation: sortDictationValues(rawDictation)
                };
            }

            function normalizeBookList(value) {
                if (!Array.isArray(value)) return [];
                return value.map(normalizeBookItem).filter(Boolean);
            }


            function normalizeTitle(value) {
                return String(value || '').normalize('NFKC').trim();
            }

            function normalizeHttpUrl(value) {
                const raw = String(value || '').trim();
                if (!raw) return '';

                try {
                    const parsed = new URL(raw);
                    if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
                        throw new Error('网址仅支持 http 或 https');
                    }
                    return parsed.href;
                } catch (error) {
                    throw new Error('网址格式无效，请使用完整的 http:// 或 https:// 地址');
                }
            }

            function parseTitleInput(rawValue) {
                const raw = String(rawValue || '').trim();
                if (!raw) return null;

                const markdownMatch = raw.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
                if (markdownMatch) {
                    const title = markdownMatch[1].trim();
                    if (!title) return null;
                    return {
                        title,
                        url: normalizeHttpUrl(markdownMatch[2])
                    };
                }

                if (raw.startsWith('[') || raw.includes('](')) {
                    throw new Error('字词格式不完整，请使用：[字词](https://网址)');
                }

                return { title: raw, url: '' };
            }

            function formatTitleInput(item) {
                if (item.url) return `[${item.title}](${item.url})`;
                return item.title;
            }

            const fingerprintCollator = new Intl.Collator('zh-CN-u-co-pinyin', {
                sensitivity: 'variant',
                numeric: true
            });

            function getBooksFingerprint(list) {
                const canonical = normalizeBookList(list)
                    .map(item => ({
                        title: item.title,
                        url: item.url,
                        category: item.category,
                        dictation: sortDictationValues(item.dictation)
                    }))
                    .sort((a, b) => {
                        for (const field of ['category', 'title', 'url']) {
                            const compared = fingerprintCollator.compare(a[field], b[field]);
                            if (compared !== 0) return compared;
                        }
                        return fingerprintCollator.compare(
                            a.dictation.join('\u0001'),
                            b.dictation.join('\u0001')
                        );
                    });
                return JSON.stringify(canonical);
            }

            function serializeSnapshot(snapshot) {
                return JSON.stringify(normalizeBookList(snapshot), null, 2);
            }

            function getSnapshotByteLength(snapshot) {
                return new TextEncoder().encode(serializeSnapshot(snapshot)).length;
            }

            function assertSnapshotSyncSize(snapshot) {
                const byteLength = getSnapshotByteLength(snapshot);
                if (byteLength > MAX_SYNC_BYTES) {
                    throw new Error(`数据文件约 ${Math.ceil(byteLength / 1024)} KB，超过安全同步上限 750 KB`);
                }
            }

            function utf8ToBase64(text) {
                const bytes = new TextEncoder().encode(text);
                let binary = '';
                const chunkSize = 0x8000;
                for (let offset = 0; offset < bytes.length; offset += chunkSize) {
                    binary += String.fromCharCode(...bytes.subarray(offset, offset + chunkSize));
                }
                return btoa(binary);
            }

            function base64ToUtf8(base64) {
                const binary = atob(String(base64 || '').replace(/\s/g, ''));
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = String(text || '');
                return div.innerHTML;
            }

            function escapeAttribute(text) {
                return escapeHtml(text)
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;')
                    .replace(/`/g, '&#96;');
            }

            // ---------- 排序 ----------
            // 列表固定按“字词首字”的汉语拼音升序排列。
            // 首字拼音相同时，再按完整字词的拼音顺序比较，保证排序稳定。
            const titleCollator = new Intl.Collator('zh-CN-u-co-pinyin', {
                usage: 'sort',
                sensitivity: 'base',
                numeric: true
            });

            function getFirstTitleChar(value) {
                const normalized = normalizeTitle(value);
                return Array.from(normalized)[0] || '';
            }

            function sortBooks() {
                books.sort((a, b) => {
                    const titleA = normalizeTitle(a?.title);
                    const titleB = normalizeTitle(b?.title);
                    const firstA = getFirstTitleChar(titleA);
                    const firstB = getFirstTitleChar(titleB);

                    let compared = titleCollator.compare(firstA, firstB);
                    if (compared !== 0) return compared;

                    compared = titleCollator.compare(titleA, titleB);
                    if (compared !== 0) return compared;

                    compared = titleCollator.compare(a?.category || '', b?.category || '');
                    if (compared !== 0) return compared;

                    return titleCollator.compare(a?.url || '', b?.url || '');
                });
            }

            // ---------- 配置 ----------
            function loadConfig() {
                const stored = safeLocalGet(CONFIG_KEY);
                let parsed = {};
                if (stored) {
                    try {
                        parsed = JSON.parse(stored) || {};
                    } catch (error) {
                        console.error('配置解析失败:', error);
                    }
                }

                const storedLocalToken = safeLocalGet(TOKEN_KEY) || '';
                const storedSessionToken = safeSessionGet(LEGACY_TOKEN_SESSION_KEY) || '';
                const rememberToken = typeof parsed.rememberToken === 'boolean'
                    ? parsed.rememberToken
                    : Boolean(storedLocalToken);

                config = {
                    token: rememberToken
                        ? (storedLocalToken || storedSessionToken)
                        : (storedSessionToken || ''),
                    rememberToken,
                    owner: typeof parsed.owner === 'string' ? parsed.owner : '',
                    repo: typeof parsed.repo === 'string' ? parsed.repo : '',
                    file: typeof parsed.file === 'string' && parsed.file.trim()
                        ? parsed.file.trim()
                        : 'books_data.json'
                };

                cfgToken.value = config.token;
                cfgRememberToken.checked = config.rememberToken;
                cfgOwner.value = config.owner;
                cfgRepo.value = config.repo;
                cfgFile.value = config.file;
            }

            function saveConfig() {
                config.token = cfgToken.value.trim();
                config.rememberToken = cfgRememberToken.checked;
                config.owner = cfgOwner.value.trim();
                config.repo = cfgRepo.value.trim();
                config.file = cfgFile.value.trim() || 'books_data.json';

                if (config.rememberToken) {
                    safeLocalSet(TOKEN_KEY, config.token);
                    safeSessionRemove(LEGACY_TOKEN_SESSION_KEY);
                } else {
                    safeLocalRemove(TOKEN_KEY);
                    safeSessionSet(LEGACY_TOKEN_SESSION_KEY, config.token);
                }

                safeLocalSet(CONFIG_KEY, JSON.stringify({
                    rememberToken: config.rememberToken,
                    owner: config.owner,
                    repo: config.repo,
                    file: config.file
                }));
            }

            function isConfigValid() {
                return Boolean(config.token && config.owner && config.repo && config.file);
            }

            function getSyncTarget() {
                if (!config.owner || !config.repo || !config.file) return '';
                return `${config.owner}/${config.repo}/${config.file}`;
            }

            function createEmptySyncMeta(target = '') {
                return {
                    schemaVersion: SYNC_SCHEMA_VERSION,
                    target,
                    remoteSha: null,
                    lastSyncedFingerprint: null,
                    lastSyncAt: null
                };
            }

            function loadSyncMeta() {
                const stored = safeLocalGet(SYNC_META_KEY);
                if (!stored) {
                    syncMeta = createEmptySyncMeta();
                    return;
                }

                try {
                    const parsed = JSON.parse(stored);
                    if (!parsed || parsed.schemaVersion !== SYNC_SCHEMA_VERSION) {
                        syncMeta = createEmptySyncMeta();
                        saveSyncMeta();
                        return;
                    }
                    syncMeta = {
                        schemaVersion: SYNC_SCHEMA_VERSION,
                        target: typeof parsed.target === 'string' ? parsed.target : '',
                        remoteSha: typeof parsed.remoteSha === 'string' ? parsed.remoteSha : null,
                        lastSyncedFingerprint: typeof parsed.lastSyncedFingerprint === 'string'
                            ? parsed.lastSyncedFingerprint
                            : null,
                        lastSyncAt: typeof parsed.lastSyncAt === 'string' ? parsed.lastSyncAt : null
                    };
                } catch (error) {
                    syncMeta = createEmptySyncMeta();
                    saveSyncMeta();
                }
            }

            function saveSyncMeta() {
                safeLocalSet(SYNC_META_KEY, JSON.stringify(syncMeta));
                updateLastSyncDisplay();
            }

            function ensureSyncTarget() {
                const target = getSyncTarget();
                if (syncMeta.target !== target) {
                    syncMeta = createEmptySyncMeta(target);
                    saveSyncMeta();
                }
            }

            function recordSynced(snapshot, remoteSha) {
                syncMeta = {
                    schemaVersion: SYNC_SCHEMA_VERSION,
                    target: getSyncTarget(),
                    remoteSha: remoteSha || null,
                    lastSyncedFingerprint: getBooksFingerprint(snapshot),
                    lastSyncAt: new Date().toISOString()
                };
                saveSyncMeta();
            }

            function updateLastSyncDisplay() {
                if (!syncMeta.lastSyncAt || syncMeta.target !== getSyncTarget()) {
                    lastSyncTime.textContent = '未同步';
                    return;
                }
                const date = new Date(syncMeta.lastSyncAt);
                lastSyncTime.textContent = Number.isNaN(date.getTime())
                    ? '已同步'
                    : `已同步 ${date.toLocaleString()}`;
            }

            // ---------- GitHub API ----------
            function encodePath(path) {
                return String(path)
                    .split('/')
                    .filter(Boolean)
                    .map(encodeURIComponent)
                    .join('/');
            }

            function formatError(error) {
                if (!error) return '未知错误';
                if (error.status === 401) return 'Token 无效或已过期';
                if (error.status === 403) return 'Token 权限不足、仓库访问被拒绝或触发 API 限制';
                if (error.status === 404) return '仓库、分支或文件路径不存在，或 Token 无权访问';
                if (error.status === 409) return '云端文件已被其他设备修改';
                if (error.status === 422) return `请求校验失败：${error.message}`;
                return error.message || String(error);
            }

            async function githubApi(method, endpoint, body = null) {
                const owner = encodeURIComponent(config.owner);
                const repo = encodeURIComponent(config.repo);
                const response = await fetch(
                    `https://api.github.com/repos/${owner}/${repo}/${endpoint}`,
                    {
                        method,
                        headers: {
                            'Authorization': `Bearer ${config.token}`,
                            'Accept': 'application/vnd.github+json',
                            ...(body !== null ? { 'Content-Type': 'application/json' } : {})
                        },
                        ...(body !== null ? { body: JSON.stringify(body) } : {})
                    }
                );

                const raw = await response.text();
                let payload = null;
                if (raw) {
                    try {
                        payload = JSON.parse(raw);
                    } catch (error) {
                        payload = { message: raw };
                    }
                }

                if (!response.ok) {
                    const apiError = new Error(payload?.message || `HTTP ${response.status}`);
                    apiError.status = response.status;
                    apiError.payload = payload;
                    throw apiError;
                }

                return payload;
            }

            function getContentsEndpoint() {
                const path = encodePath(config.file);
                if (!path) throw new Error('数据文件名不能为空');
                return `contents/${path}`;
            }

            async function readRemoteFile() {
                try {
                    const data = await githubApi('GET', getContentsEndpoint());
                    if (!data || data.type !== 'file') throw new Error('云端路径不是普通文件');
                    if (Number.isFinite(data.size) && data.size > MAX_SYNC_BYTES) {
                        throw new Error(`云端数据文件超过 750 KB 的安全同步上限`);
                    }
                    if (data.encoding !== 'base64' || typeof data.content !== 'string' || !data.sha) {
                        throw new Error('云端文件无法通过 Contents API 安全读取');
                    }

                    let parsed;
                    try {
                        parsed = JSON.parse(base64ToUtf8(data.content));
                    } catch (error) {
                        throw new Error(`云端数据无法解析：${error.message}`);
                    }

                    if (!Array.isArray(parsed)) throw new Error('云端 JSON 根节点必须是数组');
                    const normalized = normalizeBookList(parsed);
                    assertSnapshotSyncSize(normalized);
                    return {
                        exists: true,
                        sha: data.sha,
                        books: normalized
                    };
                } catch (error) {
                    if (error.status === 404) {
                        return { exists: false, sha: null, books: [] };
                    }
                    throw error;
                }
            }

            async function writeRemoteFile(snapshot, sha) {
                const normalized = normalizeBookList(snapshot);
                assertSnapshotSyncSize(normalized);
                const body = {
                    message: `更新图书数据 - ${new Date().toLocaleString()}`,
                    content: utf8ToBase64(serializeSnapshot(normalized))
                };
                if (sha) body.sha = sha;

                const result = await githubApi('PUT', getContentsEndpoint(), body);
                return result?.content?.sha || null;
            }

            // ---------- 后台冲突备份 ----------
            function loadConflictBackups() {
                const stored = safeLocalGet(CONFLICT_BACKUP_KEY);
                if (!stored) return [];
                try {
                    const parsed = JSON.parse(stored);
                    if (!Array.isArray(parsed)) return [];
                    return parsed
                        .filter(item => item && Array.isArray(item.books))
                        .map(item => ({
                            createdAt: item.createdAt || new Date().toISOString(),
                            source: item.source || 'unknown',
                            target: item.target || '',
                            books: normalizeBookList(item.books)
                        }))
                        .slice(-MAX_CONFLICT_BACKUPS);
                } catch (error) {
                    return [];
                }
            }

            function saveConflictBackup(snapshot, source) {
                const backups = loadConflictBackups();
                backups.push({
                    createdAt: new Date().toISOString(),
                    source,
                    target: getSyncTarget(),
                    books: normalizeBookList(snapshot)
                });
                safeLocalSet(
                    CONFLICT_BACKUP_KEY,
                    JSON.stringify(backups.slice(-MAX_CONFLICT_BACKUPS))
                );
            }

            // ---------- 同步冲突处理 ----------
            async function adoptRemote(remote, expectedLocalFingerprint, showToastMsg, revalidate = true) {
                if (getBooksFingerprint(books) !== expectedLocalFingerprint) {
                    syncQueued = true;
                    showToast('同步期间本地数据发生变化，已保留本地内容并重新排队', 'info');
                    return { ok: false, conflict: false };
                }

                let candidate = remote;
                if (revalidate) {
                    candidate = await readRemoteFile();
                    if (!candidate.exists) {
                        setCloudStatus('offline', '存在冲突');
                        showToast('准备下载时发现云端文件已被删除，未覆盖本地数据', 'error');
                        return { ok: false, conflict: true };
                    }
                }

                if (getBooksFingerprint(books) !== expectedLocalFingerprint) {
                    syncQueued = true;
                    return { ok: false, conflict: false };
                }

                saveConflictBackup(books, 'before_remote_replace');
                books = normalizeBookList(candidate.books);
                applySortAndRender();
                recordSynced(books, candidate.sha);
                setCloudStatus('online', '已连接');
                if (showToastMsg) showToast(`已从 GitHub 更新 ${books.length} 个条目`, 'success');
                return { ok: true, conflict: false };
            }

            async function resolveRemoteDeletion(localSnapshot, interactive) {
                setCloudStatus('offline', '云端文件已删除');
                if (!interactive) {
                    showToast('检测到云端数据文件已删除，已停止自动同步；请点击“同步”处理', 'error');
                    return { ok: false, conflict: true };
                }

                const recreate = confirm(
                    '检测到云端数据文件已删除。\n\n' +
                    '确定：用本地数据重新创建云端文件。\n' +
                    '取消：保留本地数据且不创建文件。'
                );
                if (!recreate) return { ok: false, conflict: true };

                const latest = await readRemoteFile();
                if (latest.exists) {
                    const error = new Error('确认期间云端文件已重新出现，请重新同步');
                    error.status = 409;
                    throw error;
                }

                const newSha = await writeRemoteFile(localSnapshot, null);
                recordSynced(localSnapshot, newSha);
                setCloudStatus('online', '已连接');
                showToast(`已重新创建云端文件并同步 ${localSnapshot.length} 个条目`, 'success');
                return {
                    ok: true,
                    conflict: false,
                    uploadedFingerprint: getBooksFingerprint(localSnapshot)
                };
            }

            async function resolveConflict(remote, localSnapshot, localFingerprint, interactive) {
                setCloudStatus('offline', '存在冲突');
                if (!interactive) {
                    showToast('本地和云端都发生了修改；已停止自动同步，请点击“同步”选择版本', 'error');
                    return { ok: false, conflict: true };
                }

                const useLocal = confirm(
                    '检测到同步冲突。\n\n' +
                    '确定：用本地数据覆盖刚才读取到的云端版本。\n' +
                    '取消：继续选择是否采用云端数据。'
                );

                if (useLocal) {
                    saveConflictBackup(remote.books, 'remote_before_local_override');
                    const newSha = await writeRemoteFile(localSnapshot, remote.sha);
                    recordSynced(localSnapshot, newSha);
                    setCloudStatus('online', '已连接');
                    showToast(`已用本地 ${localSnapshot.length} 个条目覆盖云端`, 'success');
                    return {
                        ok: true,
                        conflict: false,
                        uploadedFingerprint: localFingerprint
                    };
                }

                const useRemote = confirm(
                    '是否用最新云端数据覆盖本地？\n\n' +
                    '确定：采用云端数据，本地当前数据会保存为后台冲突备份。\n' +
                    '取消：暂不处理。'
                );
                if (useRemote) {
                    return adoptRemote(remote, getBooksFingerprint(books), true, true);
                }

                showToast('已取消同步，未覆盖任何数据', 'info');
                return { ok: false, conflict: true };
            }

            async function performSync({ showToastMsg, interactive }) {
                ensureSyncTarget();

                const localSnapshot = normalizeBookList(books);
                assertSnapshotSyncSize(localSnapshot);
                const localFingerprint = getBooksFingerprint(localSnapshot);
                const baseline = syncMeta.lastSyncedFingerprint;
                const hasBaseline = typeof baseline === 'string';
                const remote = await readRemoteFile();

                if (!remote.exists && hasBaseline) {
                    return resolveRemoteDeletion(localSnapshot, interactive);
                }

                if (!remote.exists) {
                    const newSha = await writeRemoteFile(localSnapshot, null);
                    recordSynced(localSnapshot, newSha);
                    setCloudStatus('online', '已连接');
                    if (showToastMsg) {
                        showToast(`已创建云端文件并同步 ${localSnapshot.length} 个条目`, 'success');
                    }
                    return {
                        ok: true,
                        conflict: false,
                        uploadedFingerprint: localFingerprint
                    };
                }

                const remoteFingerprint = getBooksFingerprint(remote.books);
                if (localFingerprint === remoteFingerprint) {
                    recordSynced(localSnapshot, remote.sha);
                    setCloudStatus('online', '已连接');
                    if (showToastMsg) showToast('本地与云端已一致', 'success');
                    return { ok: true, conflict: false };
                }

                const localChanged = !hasBaseline || localFingerprint !== baseline;
                const remoteChanged = !hasBaseline || remoteFingerprint !== baseline;

                if (hasBaseline && localChanged && !remoteChanged) {
                    const newSha = await writeRemoteFile(localSnapshot, remote.sha);
                    recordSynced(localSnapshot, newSha);
                    setCloudStatus('online', '已连接');
                    if (showToastMsg) {
                        showToast(`成功同步 ${localSnapshot.length} 个条目到 GitHub`, 'success');
                    }
                    return {
                        ok: true,
                        conflict: false,
                        uploadedFingerprint: localFingerprint
                    };
                }

                if (hasBaseline && !localChanged && remoteChanged) {
                    return adoptRemote(remote, localFingerprint, showToastMsg, true);
                }

                if (!hasBaseline && !hasStoredLocalData) {
                    return adoptRemote(remote, localFingerprint, showToastMsg, true);
                }

                return resolveConflict(remote, localSnapshot, localFingerprint, interactive);
            }

            async function syncToCloud(showToastMsg = true, interactive = showToastMsg) {
                if (!isConfigValid()) {
                    showToast('请先点击“配置”设置 GitHub 连接', 'error');
                    return false;
                }

                if (isSyncing) {
                    syncQueued = true;
                    return false;
                }

                clearTimeout(autoSyncTimer);
                autoSyncTimer = null;
                isSyncing = true;
                syncBtn.disabled = true;
                setCloudStatus('syncing', '同步中...');

                let result = { ok: false, conflict: false };
                try {
                    result = await performSync({ showToastMsg, interactive });
                } catch (error) {
                    console.error('同步失败:', error);
                    if (error.status === 409) {
                        setCloudStatus('offline', '存在冲突');
                        showToast('云端在上传期间再次变化，未覆盖任何数据；请重新同步', 'error');
                        result = { ok: false, conflict: true };
                    } else {
                        setCloudStatus('offline', '同步失败');
                        showToast(`同步失败：${formatError(error)}`, 'error');
                    }
                } finally {
                    isSyncing = false;
                    syncBtn.disabled = false;
                }

                if (
                    result.uploadedFingerprint &&
                    getBooksFingerprint(books) !== result.uploadedFingerprint
                ) {
                    syncQueued = true;
                }

                if (syncQueued && !result.conflict) {
                    syncQueued = false;
                    setTimeout(() => syncToCloud(false, false), 0);
                } else if (result.conflict) {
                    syncQueued = false;
                }

                return result.ok;
            }

            function scheduleAutoSync() {
                if (!isConfigValid()) return;
                clearTimeout(autoSyncTimer);
                autoSyncTimer = setTimeout(() => {
                    autoSyncTimer = null;
                    syncToCloud(false, false);
                }, AUTO_SYNC_DELAY);
            }

            function markLocalChange() {
                if (isConfigValid()) {
                    setCloudStatus('offline', '待同步');
                    lastSyncTime.textContent = '有未同步修改';
                }
                scheduleAutoSync();
            }

            // ---------- 本地存储 ----------
            function loadFromLocal() {
                const stored = safeLocalGet(STORAGE_KEY);
                hasStoredLocalData = stored !== null;
                if (stored !== null) {
                    try {
                        books = normalizeBookList(JSON.parse(stored));
                    } catch (error) {
                        console.error('本地图书数据解析失败:', error);
                        books = [];
                    }
                } else {
                    books = [];
                }
                applySortAndRender();
            }

            function saveToLocal() {
                safeLocalSet(STORAGE_KEY, JSON.stringify(books));
            }

            // ---------- 渲染 ----------
            function applySortAndRender() {
                sortBooks();
                syncCategoryOptionsFromBooks();
                syncDictationOptionsFromBooks();
                renderTable();
                saveToLocal();
            }

            function renderTable() {
                countDisplay.textContent = books.length;
                if (books.length === 0) {
                    tableBody.innerHTML = '<tr class="empty-row"><td colspan="1">图书列表为空，添加一本书吧！</td></tr>';
                    return;
                }

                tableBody.innerHTML = books.map((item, index) => {
                    const title = escapeHtml(item.title);
                    const category = escapeHtml(item.category || '');
                    const dictation = sortDictationValues(item.dictation || [])
                        .map(escapeHtml)
                        .join('、');
                    const titleHtml = item.url
                        ? `<a href="${escapeAttribute(item.url)}" target="_blank" rel="noopener noreferrer">${title}</a>`
                        : title;
                    const categoryHtml = category
                        ? `<div class="book-meta book-category">${category}</div>`
                        : '';
                    const dictationHtml = dictation
                        ? `<div class="book-meta book-dictation">${dictation}</div>`
                        : '';

                    return `
                        <tr data-index="${index}">
                            <td class="book-entry">
                                <div class="book-title-row">
                                    <div class="book-title-text">${titleHtml}</div>
                                    <button class="action-btn edit-btn" data-index="${index}" title="编辑">编辑</button>
                                </div>
                                ${categoryHtml}
                                ${dictationHtml}
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            // ---------- 添加与编辑 ----------
            function addBook() {
                let parsed;
                try {
                    parsed = parseTitleInput(titleInput.value);
                } catch (error) {
                    alert(error.message);
                    titleInput.focus();
                    return;
                }

                if (!parsed) {
                    alert('请填写“字词”字段。');
                    titleInput.focus();
                    return;
                }

                const category = normalizeCategoryValue(categoryInput.value);
                if (normalizeDictationValue(dictationInput.value)) commitDictationInput('add');
                const dictation = sortDictationValues(pendingAddDictation);

                books.push({
                    title: parsed.title,
                    url: parsed.url,
                    category,
                    dictation
                });
                rememberCategory(category);
                rememberDictationValues(dictation);

                applySortAndRender();
                markLocalChange();
                titleInput.value = '';
                categoryInput.value = '';
                dictationInput.value = '';
                pendingAddDictation = [];
                renderDictationCombo('add');
                titleInput.focus();
            }

            function getEditCurrentState() {
                return {
                    title: editTitleInput.value,
                    category: editCategoryInput.value,
                    dictationDraft: editDictationInput.value,
                    dictation: sortDictationValues(pendingEditDictation)
                };
            }

            function isEditUnchanged() {
                if (!editInitialState) return true;
                const current = getEditCurrentState();
                return current.title === editInitialState.title &&
                    current.category === editInitialState.category &&
                    current.dictationDraft === editInitialState.dictationDraft &&
                    JSON.stringify(current.dictation) === JSON.stringify(editInitialState.dictation);
            }

            function openEditModal(index) {
                editingIndex = index;
                const item = books[index];
                editTitleDisplay.textContent = item.title;
                editTitleInput.value = formatTitleInput(item);
                editCategoryInput.value = item.category || '';
                editDictationInput.value = '';
                pendingEditDictation = sortDictationValues(item.dictation || []);
                renderDictationCombo('edit');

                // 记录打开编辑框时的原始内容；修改后再恢复原值，也视为“未修改”。
                editInitialState = getEditCurrentState();

                editModal.classList.remove('hidden');
                setTimeout(() => editTitleInput.focus(), 100);
            }

            function closeEditModal() {
                editModal.classList.add('hidden');
                editingIndex = null;
                editInitialState = null;
                editDictationInput.value = '';
                pendingEditDictation = [];
                closeCategoryMenus();
                closeDictationMenus();
            }

            function saveEdit() {
                if (!Number.isInteger(editingIndex) || editingIndex < 0 || editingIndex >= books.length) {
                    alert('编辑出错，请重试。');
                    closeEditModal();
                    return;
                }

                let parsed;
                try {
                    parsed = parseTitleInput(editTitleInput.value);
                } catch (error) {
                    alert(error.message);
                    editTitleInput.focus();
                    return;
                }

                if (!parsed) {
                    alert('请填写“字词”字段。');
                    editTitleInput.focus();
                    return;
                }

                const category = normalizeCategoryValue(editCategoryInput.value);
                if (normalizeDictationValue(editDictationInput.value)) commitDictationInput('edit');
                const dictation = sortDictationValues(pendingEditDictation);

                books[editingIndex] = {
                    title: parsed.title,
                    url: parsed.url,
                    category,
                    dictation
                };
                rememberCategory(category);
                rememberDictationValues(dictation);

                closeEditModal();
                applySortAndRender();
                markLocalChange();
            }

            function deleteEditingBook() {
                if (!Number.isInteger(editingIndex) || editingIndex < 0 || editingIndex >= books.length) {
                    alert('删除出错，请重试。');
                    closeEditModal();
                    return;
                }

                const item = books[editingIndex];
                if (!confirm(`确定要删除“${item.title}”吗？`)) return;

                books.splice(editingIndex, 1);
                closeEditModal();
                applySortAndRender();
                markLocalChange();
            }

            // ---------- 分类下拉内管理 ----------
            function moveCategoryOption(index, direction) {
                const targetIndex = index + direction;
                if (
                    !Number.isInteger(index) ||
                    !Number.isInteger(targetIndex) ||
                    index < 0 ||
                    targetIndex < 0 ||
                    index >= categoryValues.length ||
                    targetIndex >= categoryValues.length
                ) return;

                const [moved] = categoryValues.splice(index, 1);
                categoryValues.splice(targetIndex, 0, moved);
                saveCategoryOptions();
                renderCategoryOptions();
                showToast(`已${direction < 0 ? '上移' : '下移'}“${moved}”`, 'success');
            }

            function renameCategoryFromMenu(index) {
                const oldCategory = categoryValues[index];
                if (!oldCategory) return;

                const prompted = prompt('修改分类：', oldCategory);
                if (prompted === null) return;

                const newCategory = normalizeCategoryValue(prompted);
                if (!newCategory) {
                    showToast('分类名称不能为空', 'error');
                    return;
                }

                const oldKey = categoryKey(oldCategory);
                const newKey = categoryKey(newCategory);

                if (oldKey === newKey && oldCategory === newCategory) return;

                const duplicateIndex = categoryValues.findIndex(
                    (value, valueIndex) =>
                        valueIndex !== index && categoryKey(value) === newKey
                );
                const duplicate = duplicateIndex >= 0;

                let updatedCount = 0;
                books = books.map(item => {
                    if (categoryKey(item.category) !== oldKey) return item;
                    updatedCount += 1;
                    return { ...item, category: newCategory };
                });

                if (categoryKey(categoryInput.value) === oldKey) {
                    categoryInput.value = newCategory;
                }
                if (categoryKey(editCategoryInput.value) === oldKey) {
                    editCategoryInput.value = newCategory;
                }

                excludedCategoryKeys.add(oldKey);
                excludedCategoryKeys.delete(newKey);

                if (duplicate) {
                    categoryValues.splice(index, 1);
                } else {
                    categoryValues[index] = newCategory;
                }

                categoryValues = uniqueCategoryValues(categoryValues);

                saveCategoryOptions();
                renderCategoryOptions();
                applySortAndRender();
                markLocalChange();

                const action = duplicate ? '已合并为' : '已修改为';
                showToast(
                    `${action}“${newCategory}”${updatedCount ? `，并更新 ${updatedCount} 个条目` : ''}`,
                    'success'
                );
            }

            function deleteCategoryOption(index) {
                const category = categoryValues[index];
                if (!category) return;

                const key = categoryKey(category);
                const usedCount = books.filter(item => categoryKey(item.category) === key).length;
                const usageNote = usedCount
                    ? `\n\n当前有 ${usedCount} 个条目使用该分类；这些条目会保留原文字。`
                    : '';

                if (!confirm(`确定从下拉菜单删除“${category}”吗？${usageNote}`)) return;

                categoryValues.splice(index, 1);
                excludedCategoryKeys.add(key);
                categoryValues = uniqueCategoryValues(categoryValues);
                saveCategoryOptions();
                renderCategoryOptions();
                showToast(`已从候选项删除“${category}”`, 'success');
            }

            // ---------- 导出与导入 ----------
            function downloadJson(data, filename) {
                const blob = new Blob([JSON.stringify(data, null, 2)], {
                    type: 'application/json;charset=utf-8'
                });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);
            }

            function exportData() {
                if (books.length === 0) {
                    alert('图书列表为空，没有可导出的数据。');
                    return;
                }
                downloadJson(books, `books_backup_${new Date().toISOString().slice(0, 10)}.json`);
                showToast('导出成功', 'success');
            }

            function importData(file) {
                if (!file || file.size > MAX_SYNC_BYTES) {
                    alert('请选择不超过 750 KB 的 JSON 文件。');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (!Array.isArray(imported)) {
                            alert('文件格式错误：根节点必须是数组。');
                            return;
                        }

                        const valid = normalizeBookList(imported);
                        if (valid.length === 0 && imported.length > 0) {
                            alert('文件中没有找到有效的图书数据。');
                            return;
                        }

                        assertSnapshotSyncSize(valid);
                        if (
                            books.length > 0 &&
                            !confirm(`当前有 ${books.length} 个条目，导入将完全替换当前列表。确定继续吗？`)
                        ) {
                            return;
                        }

                        books = valid;
                        applySortAndRender();
                        markLocalChange();
                        showToast(`成功导入 ${books.length} 个条目`, 'success');
                    } catch (error) {
                        alert(`解析文件失败：${error.message}`);
                    }
                };
                reader.onerror = () => alert('读取文件失败。');
                reader.readAsText(file, 'utf-8');
            }

            // ---------- 状态和弹窗 ----------
            function setCloudStatus(status, text) {
                statusDot.className = `dot ${status}`;
                statusText.textContent = text;
            }

            function showToast(message, type = 'info') {
                toast.textContent = message;
                toast.className = `toast ${type}`;
                toast.classList.remove('hidden');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.add('hidden'), 3500);
            }

            function isMobileConfigViewport() {
                return window.matchMedia('(max-width: 700px)').matches;
            }

            function updateConfigVisualHeight() {
                if (!isMobileConfigViewport()) {
                    document.documentElement.style.removeProperty('--config-visual-height');
                    document.documentElement.style.removeProperty('--config-visual-top');
                    return;
                }
                const viewport = window.visualViewport;
                const viewportHeight = viewport?.height || window.innerHeight || 0;
                const viewportTop = viewport?.offsetTop || 0;
                const height = Math.max(320, Math.round(viewportHeight));
                document.documentElement.style.setProperty('--config-visual-height', `${height}px`);
                document.documentElement.style.setProperty('--config-visual-top', `${Math.round(viewportTop)}px`);
            }

            function openConfigModal() {
                cfgToken.value = config.token;
                cfgRememberToken.checked = config.rememberToken;
                cfgOwner.value = config.owner;
                cfgRepo.value = config.repo;
                cfgFile.value = config.file;
                updateConfigVisualHeight();
                configScroll.scrollTop = 0;
                configModal.classList.remove('hidden');
                document.body.classList.add('config-open');
                if (!isMobileConfigViewport()) {
                    setTimeout(() => cfgToken.focus({ preventScroll: true }), 100);
                }
            }

            function closeConfigModal() {
                configModal.classList.add('hidden');
                document.body.classList.remove('config-open');
                document.documentElement.style.removeProperty('--config-visual-height');
                document.documentElement.style.removeProperty('--config-visual-top');
            }

            async function requestBrowserTokenSave(token, owner, repo) {
                if (
                    !window.isSecureContext ||
                    !navigator.credentials ||
                    typeof window.PasswordCredential !== 'function'
                ) {
                    return false;
                }

                try {
                    const credential = new PasswordCredential({
                        id: owner,
                        password: token,
                        name: `GitHub Token · ${owner}/${repo}`
                    });
                    await navigator.credentials.store(credential);
                    return true;
                } catch (error) {
                    console.info('浏览器未保存 Token 凭据:', error);
                    return false;
                }
            }

            async function saveConfigAndConnect() {
                const previousTarget = getSyncTarget();
                const token = cfgToken.value.trim();
                const owner = cfgOwner.value.trim();
                const repo = cfgRepo.value.trim();
                const file = cfgFile.value.trim() || 'books_data.json';

                if (!token) {
                    showToast('请输入 GitHub Token', 'error');
                    cfgToken.focus();
                    return;
                }
                if (!owner) {
                    showToast('请输入仓库所有者', 'error');
                    cfgOwner.focus();
                    return;
                }
                if (!repo) {
                    showToast('请输入仓库名称', 'error');
                    cfgRepo.focus();
                    return;
                }

                config = {
                    token,
                    rememberToken: cfgRememberToken.checked,
                    owner,
                    repo,
                    file
                };
                saveConfig();
                const browserSaved = config.rememberToken
                    ? await requestBrowserTokenSave(token, owner, repo)
                    : false;

                if (previousTarget !== getSyncTarget()) {
                    syncMeta = createEmptySyncMeta(getSyncTarget());
                    saveSyncMeta();
                }

                closeConfigModal();
                showToast(
                    config.rememberToken
                        ? (browserSaved
                            ? '配置已保存；浏览器已接收 Token 保存请求，正在同步...'
                            : '配置已保存到本设备；如浏览器弹出保存密码提示，请选择“保存”。正在同步...')
                        : '配置已保存；Token 仅在当前浏览器会话中保留。正在同步...',
                    'info'
                );
                syncToCloud(true, true);
            }

            // ---------- 事件 ----------
            addBtn.addEventListener('click', addBook);
            setupCategoryCombobox(categoryInput, categoryToggle, categoryDropdown);
            setupCategoryCombobox(editCategoryInput, editCategoryToggle, editCategoryDropdown);
            setupDictationCombobox('add');
            setupDictationCombobox('edit');

            document.querySelectorAll('.add-section input').forEach(input => {
                input.addEventListener('keydown', event => {
                    if (input === dictationInput) return;
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        addBook();
                    }
                });
            });

            tableBody.addEventListener('click', event => {
                const editButton = event.target.closest('.edit-btn');
                if (!editButton) return;

                const index = Number.parseInt(editButton.dataset.index, 10);
                if (!Number.isInteger(index) || index < 0 || index >= books.length) return;

                openEditModal(index);
            });

            document.addEventListener('click', event => {
                if (!event.target.closest('.category-combobox')) closeCategoryMenus();
                if (!event.target.closest('.dictation-combobox')) closeDictationMenus();
            });

            syncBtn.addEventListener('click', () => syncToCloud(true, true));
            configBtn.addEventListener('click', openConfigModal);
            configCancelBtn.addEventListener('click', closeConfigModal);
            configForm.addEventListener('submit', event => {
                event.preventDefault();
                saveConfigAndConnect();
            });
            window.visualViewport?.addEventListener('resize', () => {
                if (!configModal.classList.contains('hidden')) updateConfigVisualHeight();
            });
            window.visualViewport?.addEventListener('scroll', () => {
                if (!configModal.classList.contains('hidden')) updateConfigVisualHeight();
            });
            window.addEventListener('orientationchange', () => {
                if (!configModal.classList.contains('hidden')) {
                    setTimeout(updateConfigVisualHeight, 50);
                }
            });
            exportBtn.addEventListener('click', exportData);
            importBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', function() {
                if (this.files?.length) importData(this.files[0]);
                this.value = '';
            });

            configModal.addEventListener('click', event => {
                if (event.target === configModal) closeConfigModal();
            });

            configModal.querySelectorAll('input').forEach(input => {
                input.addEventListener('keydown', event => {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        configForm.requestSubmit();
                    }
                });
            });

            editDeleteBtn.addEventListener('click', deleteEditingBook);
            editCancelBtn.addEventListener('click', closeEditModal);
            editSaveBtn.addEventListener('click', saveEdit);
            editModal.addEventListener('click', event => {
                // 只有点击编辑框外的遮罩，并且编辑内容未发生变化时才关闭。
                if (event.target === editModal && isEditUnchanged()) {
                    closeEditModal();
                }
            });

            editModal.querySelectorAll('input').forEach(input => {
                input.addEventListener('keydown', event => {
                    if (input === editDictationInput) return;
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        saveEdit();
                    }
                });
            });

            document.addEventListener('keydown', event => {
                if (event.key !== 'Escape') return;
                closeCategoryMenus();
                closeDictationMenus();
                if (!editModal.classList.contains('hidden')) closeEditModal();
                if (!configModal.classList.contains('hidden')) closeConfigModal();
            });


            // ---------- 回到顶部 ----------
            function updateBackToTopVisibility() {
                backToTopBtn.classList.toggle('at-top', window.scrollY <= 20);
            }

            window.addEventListener('scroll', updateBackToTopVisibility, { passive: true });
            backToTopBtn.addEventListener('click', () => {
                const startY = window.scrollY || window.pageYOffset || 0;
                if (startY <= 0) return;

                const duration = 50;
                const root = document.documentElement;
                const previousInlineScrollBehavior = root.style.scrollBehavior;
                root.style.scrollBehavior = 'auto';

                const startTime = performance.now();
                const animate = now => {
                    const progress = Math.min(1, (now - startTime) / duration);
                    const eased = 1 - Math.pow(1 - progress, 2);
                    window.scrollTo(0, Math.round(startY * (1 - eased)));

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        root.style.scrollBehavior = previousInlineScrollBehavior;
                    }
                };
                requestAnimationFrame(animate);
            });

            // ---------- 初始化 ----------
            loadConfig();
            loadSyncMeta();
            loadCategoryOptions();
            loadDictationOptions();
            loadFromLocal();
            updateLastSyncDisplay();
            updateBackToTopVisibility();

            if (isConfigValid()) {
                ensureSyncTarget();
                syncToCloud(false, false);
            } else {
                setCloudStatus('offline', '未配置');
            }
        })();
    </script>
</body>
</html>
