<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Books</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f7fa;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        body.config-open {
            overflow: hidden;
            overscroll-behavior: none;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
            padding: 2rem 1.8rem;
            transition: 0.2s;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1e293b;
            letter-spacing: -0.5px;
            border-bottom: 2px solid #e9edf4;
            padding-bottom: 0.6rem;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #64748b;
            margin-left: auto;
            background: #f1f5f9;
            padding: 0.2rem 1rem;
            border-radius: 40px;
        }
        .cloud-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #475569;
            padding: 0.3rem 1rem;
            background: #f1f5f9;
            border-radius: 40px;
            margin-left: 10px;
        }
        .cloud-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .cloud-status .dot.online {
            background: #22c55e;
        }
        .cloud-status .dot.offline {
            background: #ef4444;
        }
        .cloud-status .dot.syncing {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 1rem;
        }
        .toolbar .left-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar .right-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar .btn-outline {
            background: transparent;
            border: 1px solid #d1d9e6;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .toolbar .btn-outline:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .toolbar .btn-primary-outline {
            background: #1e293b;
            border: 1px solid #1e293b;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .toolbar .btn-primary-outline:hover {
            background: #0f172a;
        }
        .toolbar .btn-sync {
            background: #1E40AF;
            border: 1px solid #1E40AF;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .toolbar .btn-sync:hover {
            background: #1E3A8A;
        }
        .toolbar .btn-sync:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .add-section {
            background: #f8fafc;
            border-radius: 24px;
            padding: 1.6rem 1.5rem;
            margin-bottom: 2.2rem;
            border: 1px solid #e2e8f0;
        }
        .add-section h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #0f172a;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .info-tip {
            font-size: 0.8rem;
            color: #64748b;
            background: #f1f5f9;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            display: inline-block;
            margin-left: 8px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem 1.2rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #475569;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            background: white;
            border: 1px solid #d1d9e6;
            border-radius: 16px;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            transition: 0.2s;
            font-family: inherit;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: 2px solid #7c9bff;
            border-color: transparent;
            box-shadow: 0 0 0 3px rgba(124, 155, 255, 0.2);
        }
        .form-group textarea {
            min-height: 60px;
        }
        .form-group select {
            appearance: auto;
            cursor: pointer;
        }
        .btn-primary {
            grid-column: 1 / -1;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 0.85rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.4rem;
        }
        .btn-primary:hover {
            background: #0f172a;
            transform: scale(0.98);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e9edf4;
            margin-top: 0.5rem;
        }
        .book-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .book-table th {
            background: #f1f5f9;
            text-align: left;
            padding: 0.9rem 1.2rem;
            font-weight: 600;
            color: #1e293b;
            border-bottom: 2px solid #d1d9e6;
            white-space: nowrap;
        }
        .book-table td {
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid #eef2f6;
            vertical-align: top;
            line-height: 1.5;
        }
        .book-table tbody tr:hover {
            background: #fafcff;
        }
        .book-table tbody tr:last-child td {
            border-bottom: none;
        }
        .book-table .col-title {
            font-weight: 600;
            color: #0f172a;
            white-space: nowrap;
            min-width: 100px;
        }
        .book-table .col-title a {
            color: #1E40AF;
            text-decoration: none;
        }
        .book-table .col-title a:hover {
            text-decoration: underline;
        }
        .book-table .col-category {
            min-width: 110px;
        }
        .book-table .col-action {
            text-align: center;
            white-space: nowrap;
            width: 110px;
        }
        .book-table .action-btn {
            background: none;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
            font-weight: 500;
            line-height: 1.4;
            margin: 0 2px;
        }
        .book-table .action-btn.edit-btn {
            padding: 0;
            border-radius: 0;
            background: transparent;
            color: #94a3b8;
            font-weight: 400;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .book-table .action-btn.edit-btn:hover,
        .book-table .action-btn.edit-btn:focus-visible {
            background: transparent;
            color: #64748b;
            transform: none;
            outline: none;
        }
        .book-table .action-btn.delete-btn {
            color: #991b1b;
            background: #fee2e2;
        }
        .book-table .action-btn.delete-btn:hover {
            background: #fecaca;
            transform: scale(1.05);
        }
        .empty-row td {
            padding: 2.5rem 1rem;
            text-align: center;
            color: #94a3b8;
            font-size: 1rem;
            background: #fafcff;
        }

        .book-list-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 1.8rem 0 0.8rem 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .book-list-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #0f172a;
        }
        .book-list-header .badge {
            background: #e9edf4;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #334155;
        }

        /* 自定义分类下拉菜单 */
        .category-combobox {
            position: relative;
            width: 100%;
        }
        .category-combobox > input {
            width: 100%;
            padding-right: 3rem;
        }
        .category-toggle {
            position: absolute;
            top: 50%;
            right: 8px;
            width: 34px;
            height: 34px;
            transform: translateY(-50%);
            border: none;
            border-radius: 50%;
            background: #f1f5f9;
            color: #64748b;
            cursor: pointer;
            font-size: 0.8rem;
            line-height: 1;
            transition: 0.15s;
        }
        .category-toggle:hover,
        .category-toggle:focus-visible {
            background: #e2e8f0;
            color: #1e293b;
            outline: none;
        }
        .category-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            z-index: 1200;
            display: none;
            max-height: 230px;
            overflow-y: auto;
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            background: white;
            box-shadow: 0 16px 35px rgba(15, 23, 42, 0.18);
        }
        .category-menu.open {
            display: block;
        }
        .category-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            margin: 4px 0;
            padding: 0.48rem 0.5rem 0.48rem 0.8rem;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            color: #1e293b;
            text-align: left;
            font: inherit;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
        }
        .category-option:hover,
        .category-option:focus-visible {
            background: #eef4ff;
            border-color: #bfdbfe;
            outline: none;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.08);
        }
        .category-option-label {
            min-width: 0;
            flex: 1 1 auto;
            overflow-wrap: anywhere;
        }
        .category-option-delete {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 27px;
            height: 27px;
            padding: 0;
            border: 1px solid #fecaca;
            border-radius: 8px;
            background: #fff;
            color: #b91c1c;
            font: inherit;
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        .category-option-delete:hover,
        .category-option-delete:focus-visible {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
            outline: none;
        }
        .category-menu-empty {
            padding: 0.7rem 0.8rem;
            color: #94a3b8;
            font-size: 0.85rem;
            text-align: center;
        }

        /* 分类历史选项管理 */
        .category-manager-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
            max-height: 340px;
            overflow-y: auto;
            padding: 2px;
        }
        .category-manager-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto auto auto;
            gap: 8px;
            align-items: center;
        }
        .category-manager-row input {
            min-width: 0;
            width: 100%;
            padding: 0.62rem 0.8rem;
            border: 1px solid #d1d9e6;
            border-radius: 12px;
            background: white;
            color: #1e293b;
            font: inherit;
        }
        .category-manager-row input:focus {
            outline: 2px solid #7c9bff;
            border-color: transparent;
        }
        .category-manager-row .action-btn {
            padding: 0.42rem 0.85rem;
            border: none;
            border-radius: 999px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
        }
        .category-manager-row .category-save-btn {
            background: #dbeafe;
            color: #1E3A8A;
        }
        .category-manager-row .category-delete-btn {
            background: #fee2e2;
            color: #991b1b;
        }
        .category-manager-empty {
            padding: 2rem 1rem;
            border: 1px dashed #cbd5e1;
            border-radius: 14px;
            color: #94a3b8;
            text-align: center;
        }
        .category-manager-note {
            margin-top: 0.8rem;
            color: #94a3b8;
            font-size: 0.78rem;
            line-height: 1.5;
        }
        .checkbox-row {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin-bottom: 1rem;
            color: #475569;
            font-size: 0.85rem;
            line-height: 1.45;
        }
        .checkbox-row input {
            width: auto;
            margin-top: 2px;
        }

        /* 编辑弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal-box {
            background: white;
            border-radius: 28px;
            padding: 2rem 2rem 1.8rem;
            max-width: 520px;
            width: 92%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.25s ease;
        }
        .modal-box h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.2rem;
        }
        .modal-box .modal-sub {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 0.8rem;
        }
        .modal-box .form-group {
            margin-bottom: 1rem;
        }
        .modal-box .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #475569;
        }
        .modal-box .form-group input,
        .modal-box .form-group textarea,
        .modal-box .form-group select {
            width: 100%;
            background: white;
            border: 1px solid #d1d9e6;
            border-radius: 14px;
            padding: 0.6rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .modal-box .form-group input:focus,
        .modal-box .form-group textarea:focus,
        .modal-box .form-group select:focus {
            outline: 2px solid #7c9bff;
            border-color: transparent;
        }
        .modal-box .form-group textarea {
            min-height: 56px;
            resize: vertical;
        }
        .modal-box .form-group select {
            appearance: auto;
            cursor: pointer;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            align-items: center;
            margin-top: 1.2rem;
        }

        /* 编辑弹窗：删除固定左下角，与右下角保存形成左右对称 */
        #editModal .modal-actions .delete {
            margin-right: auto;
        }
        .modal-actions .btn-modal {
            padding: 0.5rem 1.6rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal-actions .btn-modal.cancel {
            background: #f1f5f9;
            color: #334155;
        }
        .modal-actions .btn-modal.cancel:hover {
            background: #e2e8f0;
        }
        .modal-actions .btn-modal.save {
            background: #1e293b;
            color: white;
        }
        .modal-actions .btn-modal.save:hover {
            background: #0f172a;
        }
        .modal-actions .btn-modal.delete {
            background: #fee2e2;
            color: #991b1b;
        }
        .modal-actions .btn-modal.delete:hover {
            background: #fecaca;
        }


        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Toast 消息 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.8rem 2rem;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            background: #1e293b;
            max-width: 90%;
            text-align: center;
        }
        .toast.success {
            background: #16a34a;
        }
        .toast.error {
            background: #dc2626;
        }
        .toast.info {
            background: #1E40AF;
        }
        .toast.hidden {
            display: none;
        }

        /* 配置弹窗：中间内容独立滚动，底部操作栏固定可见 */
        .config-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding:
                max(12px, env(safe-area-inset-top))
                12px
                max(12px, env(safe-area-inset-bottom));
            z-index: 1000;
            animation: fadeIn 0.25s ease;
        }
        .config-overlay.hidden {
            display: none;
        }
        .config-box {
            background: white;
            border-radius: 28px;
            max-width: 560px;
            width: 94%;
            height: min(760px, calc(100dvh - 24px));
            max-height: calc(100vh - 24px);
            max-height: calc(100dvh - 24px);
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.25s ease;
        }
        .config-scroll {
            min-height: 0;
            overflow-y: scroll;
            overflow-x: hidden;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-gutter: stable;
            scrollbar-width: auto;
            scrollbar-color: #94a3b8 #eef2f6;
            padding: 2rem 2rem 1rem;
            touch-action: pan-y;
        }
        .config-scroll::-webkit-scrollbar { width: 10px; }
        .config-scroll::-webkit-scrollbar-track { background: #eef2f6; }
        .config-scroll::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border: 2px solid #eef2f6;
            border-radius: 999px;
        }
        .config-box h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }
        .config-box .config-desc {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 0.8rem;
        }
        .config-box .form-group { margin-bottom: 1rem; }
        .config-box .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #475569;
        }
        .config-box .form-group input {
            width: 100%;
            background: white;
            border: 1px solid #d1d9e6;
            border-radius: 14px;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .config-box .form-group input:focus {
            outline: 2px solid #7c9bff;
            border-color: transparent;
        }
        .config-box .form-group .hint {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        .config-box .form-group .hint a {
            color: #1E40AF;
            text-decoration: none;
        }
        .config-box .form-group .hint a:hover { text-decoration: underline; }
        .config-box .token-save-option {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 8px;
            margin-top: 9px;
            color: #475569;
            font-size: 0.82rem;
            font-weight: 500;
            text-transform: none;
            letter-spacing: 0;
            line-height: 1.5;
            cursor: pointer;
        }
        .config-box .token-save-option input[type="checkbox"] {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
            margin: 2px 0 0;
            padding: 0;
            accent-color: #1E40AF;
            cursor: pointer;
        }
        .config-actions {
            flex: 0 0 auto;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin: 0;
            padding: 0.95rem 2rem max(0.95rem, env(safe-area-inset-bottom));

            background: #fff;
            box-shadow: 0 -8px 22px rgba(15, 23, 42, 0.06);
        }
        .config-actions .btn-config {
            padding: 0.5rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.15s;
        }
        .config-actions .btn-config.primary { background: #1e293b; color: white; }
        .config-actions .btn-config.primary:hover { background: #0f172a; }
        .config-actions .btn-config.secondary { background: #f1f5f9; color: #334155; }
        .config-actions .btn-config.secondary:hover { background: #e2e8f0; }

        @media (max-width: 700px) {
            .container {
                padding: 1.2rem;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .book-table th,
            .book-table td {
                padding: 0.6rem 0.8rem;
                font-size: 0.85rem;
            }
            .book-table .col-title {
                min-width: 70px;
            }
            .book-table .col-action {
                width: 80px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .left-group,
            .toolbar .right-group {
                justify-content: center;
            }
            .cloud-status {
                margin-left: 0;
            }
            .config-overlay {
                top: var(--config-visual-top, 0px);
                bottom: auto;
                height: var(--config-visual-height, 100dvh);
                align-items: stretch;
                padding: 0;
            }
            .config-box {
                width: 100%;
                max-width: none;
                height: 100%;
                max-height: none;
                border-radius: 0;
            }
            .config-scroll {
                padding:
                    max(1.25rem, env(safe-area-inset-top))
                    1rem
                    1rem;
            }
            .config-actions {
                gap: 8px;
                padding:
                    0.85rem
                    1rem
                    max(0.85rem, env(safe-area-inset-bottom));
            }
            .config-actions .btn-config {
                flex: 1 1 0;
                min-width: 0;
                padding-left: 0.75rem;
                padding-right: 0.75rem;
            }
        }
    

        /* 回到顶部 */
        .back-to-top {
            position: fixed;
            right: 18px;
            top: 70%;
            transform: translateY(-50%);
            z-index: 900;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0.5rem 0.8rem;
            border: 1px solid rgba(148, 163, 184, 0.55);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.88);
            color: #64748b;
            font-family: inherit;
            font-size: 0.78rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
            opacity: 0.58;
            visibility: visible;
            pointer-events: auto;
            transition: opacity 0.2s ease, transform 0.2s ease, color 0.15s ease;
            backdrop-filter: blur(6px);
        }
        .back-to-top.at-top {
            opacity: 0.38;
        }
        .back-to-top:hover,
        .back-to-top:focus-visible {
            opacity: 1;
            color: #334155;
            transform: translateY(calc(-50% - 2px));
            outline: none;
        }
        .back-to-top .back-to-top-icon {
            font-size: 1rem;
            line-height: 1;
        }

        @media (max-width: 700px) {
            .back-to-top {
                right: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .back-to-top {
                transition: none;
            }
        }

    
        /* ===== Books 最终主题 / 单列表 / 听写 / 回顶规则 ===== */

        /* 主色与悬停色 */
        .toolbar .btn-sync,
        .btn-primary,
        .modal-actions .btn-modal.save,
        .config-actions .btn-config.primary {
            background: #1E40AF !important;
            border-color: #1E40AF !important;
            color: #fff !important;
        }

        .toolbar .btn-sync:hover,
        .btn-primary:hover,
        .modal-actions .btn-modal.save:hover,
        .config-actions .btn-config.primary:hover {
            background: #1E3A8A !important;
            border-color: #1E3A8A !important;
            color: #fff !important;
        }

        .config-box .form-group .hint a,
        .category-manager-row .category-save-btn {
            color: #1E40AF !important;
        }

        /* 总表：单列；字词 1.1rem，其它 1rem；所有内容纯黑 */
        .book-table,
        .book-table th,
        .book-table td,
        .book-table th *,
        .book-table td *,
        .book-table .book-meta,
        .book-table .edit-btn,
        .book-table .edit-btn:hover,
        .book-table .edit-btn:focus-visible,
        .book-table .empty-row td {
            color: #000 !important;
            font-size: 1rem !important;
        }

        .book-table .book-entry {
            width: 100%;
            min-width: 0;
        }

        .book-table .book-title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            width: 100%;
        }

        .book-table .book-title-text,
        .book-table .book-title-text *,
        .book-table .book-title-text a {
            min-width: 0;
            color: #000 !important;
            font-size: 1.1rem !important;
            font-weight: 600;
            overflow-wrap: anywhere;
            text-decoration: none;
        }

        .book-table .book-title-text a:hover {
            color: #000 !important;
            text-decoration: underline;
        }

        .book-table .book-meta {
            margin-top: 0.16rem;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .book-table .book-dictation,

        .book-table .edit-btn {

            background: transparent !important;
            border: 0 !important;

        /* 听写组合下拉 */
        .dictation-combobox {
            position: relative;
            width: 100%;
            min-width: 0;
        }

        .dictation-primary-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 44px;
            gap: 7px;
            width: 100%;
        }

        .dictation-primary-row input {
            width: 100%;
            min-width: 0;
        }

        .dictation-toggle {
            min-height: 44px;
            border: 1px solid #d1d9e6;
            border-radius: 16px;

            color: #475569;

            font-weight: 700;
        }

        .dictation-toggle:hover,
        .dictation-toggle:focus-visible {
            background: #f1f5f9;

        }

        .dictation-menu {
            position: absolute;
            top: calc(44px + 7px);
            left: 0;
            right: 0;

            overflow-y: auto;
            padding: 0.5rem;

        .dictation-option {

        .dictation-option:hover,
        .dictation-option:focus-visible {

        .dictation-option.is-selected {

        .dictation-empty {

        .dictation-selected {

            flex-wrap: wrap;

        .dictation-selected:empty {

        .dictation-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 0.36rem 0.58rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
            color: #0f172a;
            font-size: 0.86rem;
        }

        .dictation-chip-remove {
            width: 18px;
            height: 18px;
            padding: 0;
            border: 0;
            border-radius: 4px;
            background: #e2e8f0;

            font: inherit;
            line-height: 1;

        .dictation-chip-remove:hover {
            background: #fee2e2;
            color: #991b1b;
        }

        /* 分类管理手动排序 */
        .category-manager-row .category-move-btn {
            padding: 0.42rem 0.7rem;
            border: 0;
            border-radius: 999px;
            background: #f1f5f9;
            color: #334155;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .category-manager-row .category-move-btn:hover:not(:disabled) {
            background: #e2e8f0;
        }

        .category-manager-row .category-move-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* 回到顶部：主色实心圆，无箭头，JS 动画 50ms */
        .back-to-top {
            right: 18px !important;
            top: 70% !important;
            width: 32px !important;
            height: 32px !important;
            padding: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 0 !important;
            border: 0 !important;
            border-radius: 50% !important;
            background: #1E40AF !important;
            color: #1E40AF !important;
            font-size: 0 !important;
            text-indent: -9999px !important;
            overflow: hidden !important;
            box-shadow: 0 3px 10px rgba(30, 64, 175, 0.28) !important;
            backdrop-filter: none !important;
        }

        .back-to-top .back-to-top-icon,
        .back-to-top::before,
        .back-to-top::after {
            display: none !important;
            content: none !important;

        .back-to-top:hover,
        .back-to-top:focus-visible {

        @media (max-width: 700px) {

            .book-table td,
            .book-table th *,
            .book-table td *,

        @media (max-width: 700px) {
            .category-manager-row .category-manager-input {
                grid-column: 1 / -1;
            }
            .category-manager-row .category-save-btn,
            .category-manager-row .category-up-btn,

                grid-row: auto;
            }

        /* ===== 分类管理移入“添加 > 分类”下拉 ===== */
        .category-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .category-option-actions {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .category-option-action {
            min-width: 28px;
            height: 27px;
            padding: 0 6px;
            border: 0;
            border-radius: 8px;
            background: #f1f5f9;
            color: #334155;

            font-size: 0.78rem;
            font-weight: 650;
            line-height: 1;
            cursor: pointer;
        }

        .category-option-action:hover:not(:disabled),
        .category-option-action:focus-visible:not(:disabled) {
            background: #e2e8f0;
            outline: none;
        }

        .category-option-up,
        .category-option-down,
        .category-option-edit {

        }

        .category-option-up:hover:not(:disabled),
        .category-option-down:hover:not(:disabled),
        .category-option-edit:hover:not(:disabled),
        .category-option-up:focus-visible:not(:disabled),
        .category-option-down:focus-visible:not(:disabled),
        .category-option-edit:focus-visible:not(:disabled) {

        }

        .category-option-delete {
            color: #991b1b;
            background: #fff1f2;
        }

        .category-option-delete:hover:not(:disabled),
        .category-option-delete:focus-visible:not(:disabled) {
            color: #991b1b;
            background: #fee2e2;
        }

        .category-option-action:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>
            Books
            <span class="cloud-status" id="cloudStatus">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">未配置</span>
            </span>
        </h1>

        <div class="toolbar">
            <div class="left-group">
                <button class="btn-sync" id="syncBtn">同步</button>
                <button class="btn-outline" id="configBtn">配置</button>
                <button class="btn-outline" id="exportBtn">导出</button>
                <button class="btn-outline" id="importBtn">导入</button>
                <input type="file" id="fileInput" accept=".json" style="display: none;">
            </div>
            <div class="right-group">
                <span style="font-size:0.8rem;color:#94a3b8;" id="lastSyncTime">未同步</span>
            </div>
        </div>

        <div class="add-section">
            <h2>添加</h2>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="titleInput">字词</label>
                    <input type="text" id="titleInput" autofocus>
                </div>
                <div class="form-group full-width">
                    <label for="categoryInput">分类</label>
                    <div class="category-combobox">
                        <input
                            type="text"
                            id="categoryInput"
                            autocomplete="off"
                            role="combobox"
                            aria-autocomplete="list"
                            aria-expanded="false"
                            aria-controls="categoryDropdown"
                           
                        >
                        <button type="button" class="category-toggle" id="categoryToggle" aria-label="展开分类选项" title="展开分类选项">▼</button>
                        <div class="category-menu" id="categoryDropdown" role="listbox"></div>
                    </div>
                </div>
                <div class="form-group full-width">
                    <label for="dictationInput">听写</label>
                    <div class="dictation-combobox" id="dictationCombo">
                        <div class="dictation-primary-row">
                            <input
                                type="text"
                                id="dictationInput"
                                autocomplete="off"
                                aria-haspopup="listbox"
                                aria-expanded="false"
                                aria-controls="dictationDropdown"
                            >
                            <button type="button" class="dictation-toggle" id="dictationToggle" aria-label="展开听写选项" title="展开听写选项">▾</button>
                        </div>
                        <div class="dictation-menu" id="dictationDropdown" role="listbox"></div>
                        <div class="dictation-selected" id="dictationSelected" aria-live="polite"></div>
                    </div>
                </div>
                <button class="btn-primary" id="addBtn">添加</button>
            </div>
        </div>

        <div class="book-list-header">
            <h2>总表</h2>
            <span class="badge" id="countDisplay">0</span>
        </div>
        <div class="table-wrapper">
            <table class="book-table" id="bookTable">
                <thead>
                    <tr>
                        <th>字词</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr class="empty-row">
                        <td colspan="1">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 编辑弹窗 -->
    <div class="modal-overlay hidden" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editModalHeading">
        <div class="modal-box">
            <h3 id="editModalHeading">编辑条目</h3>
            <div class="modal-sub">字词：<span id="editTitleDisplay"></span></div>
            <div class="form-group">
                <label for="editTitleInput">字词</label>
                <input type="text" id="editTitleInput">
            </div>
            <div class="form-group">
                <label for="editCategoryInput">分类</label>
                <div class="category-combobox">
                    <input
                        type="text"
                        id="editCategoryInput"
                        autocomplete="off"
                        role="combobox"
                        aria-autocomplete="list"
                        aria-expanded="false"
                        aria-controls="editCategoryDropdown"
                    >
                    <button type="button" class="category-toggle" id="editCategoryToggle" aria-label="展开分类选项" title="展开分类选项">▼</button>
                    <div class="category-menu" id="editCategoryDropdown" role="listbox"></div>
                </div>
            </div>

                <label for="editDictationInput">听写</label>
                <div class="dictation-combobox" id="editDictationCombo">
                    <div class="dictation-primary-row">
                        <input
                            type="text"
                            id="editDictationInput"
                            autocomplete="off"
                            aria-haspopup="listbox"
                            aria-expanded="false"
                            aria-controls="editDictationDropdown"
                        >
                        <button type="button" class="dictation-toggle" id="editDictationToggle" aria-label="展开听写选项" title="展开听写选项">▾</button>

                    <div class="dictation-menu" id="editDictationDropdown" role="listbox"></div>
                    <div class="dictation-selected" id="editDictationSelected" aria-live="polite"></div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-modal delete" id="editDeleteBtn" type="button">删除</button>
                <button class="btn-modal cancel" id="editCancelBtn" type="button">取消</button>
                <button class="btn-modal save" id="editSaveBtn" type="button">保存</button>
            </div>
        </div>
    </div>

    <!-- 配置弹窗 -->
    <div class="config-overlay hidden" id="configModal" role="dialog" aria-modal="true" aria-labelledby="configModalHeading">
        <form class="config-box" id="configForm" autocomplete="on">
            <div class="config-scroll" id="configScroll">
            <h3 id="configModalHeading">GitHub 云端配置</h3>
            <div class="config-desc">
                本网页按当前网址路径独立保存本地图书、配置、同步状态和冲突备份，不会读取其他仓库页面的数据。
            </div>
            <div class="form-group">
                <label for="cfgToken">GitHub Personal Access Token *</label>
                <input
                    type="password"
                    id="cfgToken"
                    name="github-token"
                    autocomplete="current-password"
                >
                <label class="token-save-option" for="cfgRememberToken">
                    <input type="checkbox" id="cfgRememberToken" checked>
                    <span>在本设备保存Token。若浏览器出现“保存密码”提示，请选择保存；开启浏览器密码同步后，其他设备可自动填充。</span>
                </label>
                <div class="hint">
                    <a href="https://github.com/settings/personal-access-tokens"
                       target="_blank"
                       rel="noopener noreferrer">创建细粒度 Token</a>
                    （仅授权目标仓库，并授予 <strong>Contents: Read and write</strong>。共享设备建议不要勾选“在本设备保存Token”。）
                </div>
            </div>
            <div class="form-group">
                <label for="cfgOwner">仓库所有者 *</label>
                <input type="text" id="cfgOwner" name="github-owner" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="cfgRepo">仓库名称 *</label>
                <input type="text" id="cfgRepo">
            </div>
            <div class="form-group">
                <label for="cfgFile">数据文件名</label>
                <input type="text" id="cfgFile" value="books_data.json">
            </div>
            </div>
            <div class="config-actions">
                <button type="button" class="btn-config secondary" id="configCancelBtn">取消</button>
                <button type="submit" class="btn-config primary" id="configSaveBtn">保存并连接</button>
            </div>
        </form>
    </div>


    <button type="button" class="back-to-top" id="backToTopBtn" aria-label="回到顶部" title="回到顶部"></button>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

    <script>
        (function() {
            'use strict';

            // ---------- 页面实例隔离与本地存储 ----------
            function getPageInstanceIdentity() {
                let pathname = window.location.pathname || '/';
                pathname = pathname
                    .replace(/\\/g, '/')
                    .replace(/\/+/g, '/')
                    .replace(/\/(?:index\.html?)$/i, '/');

                if (pathname.length > 1 && pathname.endsWith('/')) {
                    pathname = pathname.slice(0, -1);
                }

                return `${window.location.origin}${pathname}`;
            }

            function hashIdentity(value) {
                let hash = 0x811c9dc5;
                for (let i = 0; i < value.length; i++) {
                    hash ^= value.charCodeAt(i);
                    hash = Math.imul(hash, 0x01000193);
                }
                return (hash >>> 0).toString(16).padStart(8, '0');
            }

            const PAGE_INSTANCE_ID = hashIdentity(getPageInstanceIdentity());
            const STORAGE_NAMESPACE = `books_catalog:${PAGE_INSTANCE_ID}`;
            const CONFIG_KEY = `${STORAGE_NAMESPACE}:config`;
            const TOKEN_KEY = `${STORAGE_NAMESPACE}:token_local`;
            const LEGACY_TOKEN_SESSION_KEY = `${STORAGE_NAMESPACE}:token_session`;
            const CATEGORY_OPTIONS_KEY = `${STORAGE_NAMESPACE}:category_options`;
            const DICTATION_OPTIONS_KEY = `${STORAGE_NAMESPACE}:dictation_options_v1`;
            const STORAGE_KEY = `${STORAGE_NAMESPACE}:books`;
            const SYNC_SCHEMA_VERSION = 1;
            const SYNC_META_KEY = `${STORAGE_NAMESPACE}:sync_meta_v1`;
            const CONFLICT_BACKUP_KEY = `${STORAGE_NAMESPACE}:conflict_backups_v1`;
            const MAX_CONFLICT_BACKUPS = 10;
            const MAX_SYNC_BYTES = 750 * 1024;
            const AUTO_SYNC_DELAY = 700;

            let books = [];
            let categoryValues = [];
            let excludedCategoryKeys = new Set();
            let dictationValues = [];
            let pendingAddDictation = [];
            let pendingEditDictation = [];

            // ---------- 存储工具 ----------
            function safeLocalGet(key) {

                    return localStorage.getItem(key);
                } catch (error) {
                    console.error('读取本地存储失败:', error);
                    return null;
                }
            }

            function safeLocalSet(key, value) {

                } catch (error) {
                    console.error('写入本地存储失败:', error);
                    showToast(`本地保存失败：${error.message}`, 'error');

            function safeLocalRemove(key) {

                    return true;
                } catch (error) {
                    console.error('删除本地存储失败:', error);
                    return false;
                }
            }

            function safeSessionGet(key) {

            }

            function safeSessionSet(key, value) {

            // ---------- 分类下拉选项 ----------
            function normalizeCategoryValue(value) {
                return String(value || '').normalize('NFKC').trim();
            }

            function categoryKey(value) {
                return normalizeCategoryValue(value).toLocaleLowerCase('zh-CN');
            }

            function uniqueCategoryValues(values) {
                // 分类严格保留首次出现/用户手动调整后的顺序，不再自动按拼音排序。
                const seen = new Set();
                const result = [];
                values.forEach(value => {
                    const normalized = normalizeCategoryValue(value);
                    const key = categoryKey(normalized);
                    if (!normalized || seen.has(key)) return;
                    seen.add(key);
                    result.push(normalized);
                });
                return result;
            }

            function getFilteredCategoryValues(input) {
                const query = normalizeCategoryValue(input.value).toLocaleLowerCase('zh-CN');
                if (!query) return categoryValues;
                return categoryValues.filter(value =>
                    value.toLocaleLowerCase('zh-CN').includes(query)
                );
            }

            function loadCategoryOptions() {
                const stored = safeLocalGet(CATEGORY_OPTIONS_KEY);
                categoryValues = [];
                excludedCategoryKeys = new Set();

                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed)) {
                            // 兼容旧版本只保存数组的格式。
                            categoryValues = parsed;
                        } else if (parsed && typeof parsed === 'object') {
                            categoryValues = Array.isArray(parsed.values) ? parsed.values : [];
                            excludedCategoryKeys = new Set(
                                Array.isArray(parsed.excluded)
                                    ? parsed.excluded.map(categoryKey).filter(Boolean)
                                    : []
                            );
                        }
                    } catch (error) {
                        console.error('分类候选项解析失败:', error);

                categoryValues = uniqueCategoryValues(categoryValues)
                    .filter(value => !excludedCategoryKeys.has(categoryKey(value)));

            function rememberCategory(value) {
                const normalized = normalizeCategoryValue(value);
                const key = categoryKey(normalized);
                if (!normalized) return;

                excludedCategoryKeys.delete(key);
                if (!categoryValues.some(item => categoryKey(item) === key)) {
                    categoryValues.push(normalized);
                }
                categoryValues = uniqueCategoryValues(categoryValues);
                saveCategoryOptions();
                renderCategoryOptions();
            }

            function syncCategoryOptionsFromBooks() {
                let changed = false;
                books.forEach(item => {

                    const key = categoryKey(normalized);
                    if (

                    ) {

            // ---------- 听写下拉：无预设，用户手动添加；候选项和条目内均按首字母排序 ----------
            const dictationCollator = new Intl.Collator('en', {
                usage: 'sort',
                sensitivity: 'base',
                numeric: true
            });

            function normalizeDictationValue(value) {
                return String(value || '').normalize('NFKC').trim();
            }

            function dictationKey(value) {
                return normalizeDictationValue(value).toLocaleLowerCase('en');
            }

            function compareDictationValues(a, b) {
                const valueA = normalizeDictationValue(a);
                const valueB = normalizeDictationValue(b);
                const firstA = Array.from(valueA)[0] || '';
                const firstB = Array.from(valueB)[0] || '';

                let compared = dictationCollator.compare(firstA, firstB);
                if (compared !== 0) return compared;

                compared = dictationCollator.compare(valueA, valueB);
                if (compared !== 0) return compared;

                return valueA < valueB ? -1 : (valueA > valueB ? 1 : 0);
            }

            function sortDictationValues(values) {
                const seen = new Set();
                const result = [];
                (Array.isArray(values) ? values : []).forEach(raw => {
                    const value = normalizeDictationValue(raw);
                    const key = dictationKey(value);
                    if (!value || seen.has(key)) return;
                    seen.add(key);
                    result.push(value);
                });
                return result.sort(compareDictationValues);
            }

            function saveDictationOptions() {
                dictationValues = sortDictationValues(dictationValues);
                safeLocalSet(DICTATION_OPTIONS_KEY, JSON.stringify(dictationValues));
            }

            function loadDictationOptions() {
                dictationValues = [];
                const stored = safeLocalGet(DICTATION_OPTIONS_KEY);

                    }
                }
                renderDictationCombo('add');
                renderDictationCombo('edit');
            }

            function rememberDictationValues(values) {
                const merged = sortDictationValues([
                    ...dictationValues,
                    ...(Array.isArray(values) ? values : [values])
                ]);
                if (JSON.stringify(merged) !== JSON.stringify(dictationValues)) {
                    dictationValues = merged;
                    saveDictationOptions();
                }
                renderDictationCombo('add');
                renderDictationCombo('edit');
            }

            function renderDictationCombo(which) {

            function commitDictationInput(which) {
                const ctx = getDictationContext(which);
                const value = normalizeDictationValue(ctx.input.value);
                if (!value) return false;

                const selected = sortDictationValues([...ctx.selected, value]);
                setPendingDictation(which, selected);
                rememberDictationValues(value);
                ctx.input.value = '';
                renderDictationCombo(which);
                return true;

            function toggleDictationSelection(which, value) {
                const ctx = getDictationContext(which);
                const normalized = normalizeDictationValue(value);
                const key = dictationKey(normalized);
                const exists = ctx.selected.some(item => dictationKey(item) === key);
                const next = exists
                    ? ctx.selected.filter(item => dictationKey(item) !== key)
                    : [...ctx.selected, normalized];
                setPendingDictation(which, next);
                rememberDictationValues(normalized);
                renderDictationCombo(which);

                ctx.input.addEventListener('keydown', event => {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        event.stopPropagation();
                        commitDictationInput(which);
                        closeDictationMenus();
                        ctx.input.focus();
                    } else if (event.key === 'ArrowDown') {
                        event.preventDefault();
                        openDictationMenu(which);
                        ctx.menu.querySelector('.dictation-option')?.focus();
                    } else if (event.key === 'Escape') {
                        closeDictationMenus();

                    if (!option) return;

                    if (!event.target.matches('.dictation-option')) return;
                    const options = [...ctx.menu.querySelectorAll('.dictation-option')];
                    const index = options.indexOf(event.target);

                    if (event.key === 'ArrowDown') {
                        event.preventDefault();
                        options[(index + 1) % options.length]?.focus();
                    } else if (event.key === 'ArrowUp') {
                        event.preventDefault();
                        options[(index - 1 + options.length) % options.length]?.focus();
                    } else if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        toggleDictationSelection(which, event.target.dataset.value || '');
                    } else if (event.key === 'Escape') {
                        closeDictationMenus();

                    );
                    renderDictationCombo(which);
                });
            }
